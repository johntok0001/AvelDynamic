name: Build Avel Dynamic installers

# Every push to main builds both installers and publishes them on the Releases page
# as "Avel Dynamic <version>" (the version comes from CMakeLists.txt; same version = release updated).
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS installer (.pkg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target AvelDynamic_VST3 AvelDynamic_AU --parallel

      - name: Validate Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/AvelDynamic_artefacts/Release/AU/Avel Dynamic.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          set +e
          auval -v aufx AvDy Avel > auval.txt 2>&1
          code=$?
          set -e
          echo "::notice title=auval (exit $code)::$(tail -n 12 auval.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/Avel Dynamic.component"
          grep -q "AU VALIDATION SUCCEEDED" auval.txt

      - name: Validate VST3 with pluginval
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          set +e
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --skip-gui-tests --validate-in-process --timeout-ms 600000 --validate "build/AvelDynamic_artefacts/Release/VST3/Avel Dynamic.vst3" > pluginval.txt 2>&1
          code=$?
          echo "::notice title=pluginval macOS (exit $code)::$(grep -E 'FAIL|!!!|Error|SUCCESS|Starting tests in' pluginval.txt | tail -n 30 | sed ':a;N;$!ba;s/\n/%0A/g')"
          exit $code

      - name: Make installer
        run: bash make_installer_mac.sh --no-build

      - name: Test installer
        run: |
          sudo installer -pkg dist/AvelDynamic-*-macOS.pkg -target /
          test -f "/Library/Audio/Plug-Ins/VST3/Avel Dynamic.vst3/Contents/MacOS/Avel Dynamic"
          test -d "/Library/Audio/Plug-Ins/Components/Avel Dynamic.component"
          archs=$(lipo -archs "/Library/Audio/Plug-Ins/VST3/Avel Dynamic.vst3/Contents/MacOS/Avel Dynamic")
          echo "::notice title=macOS binary architectures::$archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]

      - uses: actions/upload-artifact@v4
        with:
          name: AvelDynamic-macOS-installer
          path: dist/*.pkg

  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin
        run: |
          cmake -S . -B build
          cmake --build build --config Release --target AvelDynamic_VST3 --parallel

      - name: Validate VST3 with pluginval
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive -Force pluginval.zip -DestinationPath pv
          $exe = Get-ChildItem -Recurse pv -Filter pluginval.exe | Select-Object -First 1
          # pluginval is a GUI-subsystem app: wait for it explicitly, otherwise the shell returns at once
          $p = Start-Process -FilePath $exe.FullName -Wait -PassThru -NoNewWindow -RedirectStandardOutput pluginval.txt -RedirectStandardError pluginval-err.txt `
                 -ArgumentList '--strictness-level','10','--skip-gui-tests','--validate-in-process','--timeout-ms','600000','--validate','"build\AvelDynamic_artefacts\Release\VST3\Avel Dynamic.vst3"'
          $lines = (Get-Content pluginval.txt, pluginval-err.txt -ErrorAction SilentlyContinue | Select-String -Pattern 'FAIL|!!!|Error|SUCCESS|Starting tests in' | Select-Object -Last 30) -join '%0A'
          Write-Output "::notice title=pluginval Windows (exit $($p.ExitCode))::$lines"
          exit $p.ExitCode

      - name: Install Inno Setup
        run: choco upgrade innosetup -y --no-progress

      - name: Make installer
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(AvelDynamic VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\AvelDynamic.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\AvelDynamic-*-Windows-Setup.exe | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (-not (Test-Path "$env:CommonProgramFiles\VST3\Avel Dynamic.vst3\Contents\x86_64-win\Avel Dynamic.vst3")) { throw "plugin not installed" }

      - uses: actions/upload-artifact@v4
        with:
          name: AvelDynamic-Windows-installer
          path: dist/*.exe

  release:
    name: Publish release
    needs: [ macos, windows ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(sed -n 's/^project(AvelDynamic VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Avel Dynamic ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.pkg
            dist/*.exe
          body: |
            **macOS:** скачайте `AvelDynamic-${{ steps.ver.outputs.version }}-macOS.pkg`, дважды кликните и установите (VST3 + AU).
            Если macOS не даёт открыть: Системные настройки → Конфиденциальность и безопасность → «Всё равно открыть».

            **Windows:** скачайте `AvelDynamic-${{ steps.ver.outputs.version }}-Windows-Setup.exe` и запустите (VST3).
            Если появится «Windows защитила ваш компьютер»: Подробнее → Выполнить в любом случае.

            После установки перезапустите DAW и пересканируйте плагины.
